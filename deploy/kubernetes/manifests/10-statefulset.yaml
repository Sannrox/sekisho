# One replica: the directory state backend keeps registry, policy,
# mitigations and audit on the volume, guarded by exclusive file locks.
# The claim outlives the pod, a restart, an upgrade and an uninstall.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sekisho
  labels:
    app.kubernetes.io/name: sekisho
spec:
  serviceName: sekisho
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sekisho
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sekisho
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sekisho
          image: "@IMAGE@"
          args: ["serve", "--config", "/etc/sekisho/sekisho.toml"]
          ports:
            - name: http
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/sekisho
              readOnly: true
            - name: data
              mountPath: /var/lib/sekisho
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # Ready when every store can do work, and a configured issuer
          # or control plane can be reached. timeoutSeconds covers the
          # 5 s store deadline and 2 s origin probe running together.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          secret:
            secretName: sekisho-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
