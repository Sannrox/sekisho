# Copy to sekisho.toml. Relative paths resolve from this file's directory.
listen = "127.0.0.1:8090"

[verifier]
kind = "jwks"                         # or "static" (development, loopback only)
issuer = "https://issuer.example.test"
audience = "sekisho"
jwks_file = "jwks.json"               # local file; Sekisho never fetches keys

# [verifier]
# kind = "static"
# token_file = "dev-token"            # compared in constant time

[mcp]
resource = "http://127.0.0.1:8090/mcp"          # canonical URL clients use
authorization_servers = ["https://issuer.example.test"]
# allowed_hosts = ["localhost", "127.0.0.1", "[::1]"]   # default; set your public host
# allowed_origins = ["https://console.example.test:443"] # browsers only; default refuses any Origin
# max_request_bytes = 1048576
# progressive = false                                  # true: list only sekisho.* meta-tools

[registry]
file = "registry.json"                 # owner state; edit with `sekisho registry`
audit_file = "registry-audit.jsonl"    # one line per owner edit
refresh_interval_ms = 30000            # re-list upstreams and reload the registry

[[upstreams]]
name = "ontology"                      # tools appear as ontology.<tool>
url = "http://127.0.0.1:9100/mcp"
# token_file = "ontology-token"        # optional bearer used to list tools
audience = "ontology-engine"           # audience of exchanged tokens for these tools

[policy]
file = "agents.toml"                   # per-agent allowlists, read on every call

[exchange]                             # RFC 8693 token exchange per tool call
token_endpoint = "https://issuer.example.test/token"
client_id = "sekisho"
client_secret_file = "exchange-secret"
# lifetime_secs = 60

[audit]
calls_file = "calls.jsonl"             # one line per tool call: caller, agent, tool, decision, trace id

# [mitigations]                       # edit with `sekisho mitigation`; every replica must share these
# file = "mitigations.json"           # default: in [cluster] state_dir when set, else next to this file
# audit_file = "mitigations-audit.jsonl" # apply, lift, expire and refused decisions; same default

# [cluster]
# state_dir = "cluster"                # shared rate-limit and mitigation files; replicas point here
                                       # needs a filesystem with exclusive locks shared by all replicas

[limits]                               # defaults shown
agent = { rate_per_sec = 10.0, burst = 20.0 }
user = { rate_per_sec = 20.0, burst = 40.0 }
tenant = { rate_per_sec = 100.0, burst = 200.0 }
max_response_bytes = 1048576
max_call_ms = 60000
# [limits.costs]
# "ontology.search" = 2.0

# [approvals]                         # approval gate for destructive and open-world tools
# marked = ["records.delete"]         # need an approval route; refused without one
# engine = ["records.delete"]         # the upstream parks and decides the call as an Action

[guardrails]                          # runtime screening of tool traffic; defaults shown
# inbound = "annotate"                # annotate | redact | block | allow (tool results)
# outbound = "block"                  # block | redact | allow (tool arguments; secrets and personal data)
# max_result_bytes = 262144
# [guardrails.tools."ontology.search"]   # per-tool layer, most specific
# inbound = "block"
# [guardrails.tenants."tenant-1"]        # per-tenant layer
# outbound = "redact"
