[package]
name = "sekisho"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Governed tool gateway for AI agents: one MCP entry point with per-agent identity, token exchange, tool registry, rate limits, approvals and audit."
publish = false

[features]
# PostgreSQL state backend for rate limits and call audit (#46). A default
# build has no PostgreSQL dependency.
postgres = ["dep:postgres", "dep:rustls", "dep:rustls-native-certs", "dep:tokio-postgres-rustls"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4.6.7", features = ["derive"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
libc = "0.2.191"
postgres = { version = "0.19.14", optional = true, features = ["with-serde_json-1"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
rmcp = { version = "3.5.1", features = ["client", "reqwest", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = { version = "0.8.5", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-postgres-rustls = { version = "0.14.0", optional = true, features = ["aws-lc-rs"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["cors"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "form"] }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net"] }

# Dependencies build without debug info in dev and test builds: backtraces
# and debuggers keep full detail for workspace crates, and build directories
# stay a fraction of the size.
[profile.dev.package."*"]
debug = false
