[package]
name = "sekisho"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Governed tool gateway for AI agents: one MCP entry point with per-agent identity, token exchange, tool registry, rate limits, approvals and audit."
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4.6.7", features = ["derive"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rmcp = { version = "3.5.1", features = ["client", "reqwest", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["cors"] }

[dev-dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net"] }
